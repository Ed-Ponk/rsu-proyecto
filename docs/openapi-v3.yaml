openapi: 3.1.0
info:
  title: RSU V3
  version: 3.0.0
servers:
  - url: /api
paths:
  /v1/salud:
    get:
      summary: Identificar la versión del servidor y comprobar el acceso al esquema
      responses:
        '200':
          description: Servicio RSU disponible
          content:
            application/json:
              example: {servicio: rsu, version: 3}
        '503':
          description: La base o el esquema no está disponible. Se mantiene el cuerpo sin diagnósticos internos.
          content:
            application/json:
              example: {servicio: rsu, version: 3}
  /v1/ciudadano/registro:
    post:
      summary: Crear cuenta ciudadana y emitir token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni, name, last_name, email, password, zone_id]
              properties:
                dni: {type: string, pattern: '^[0-9]{8}$'}
                name: {type: string, maxLength: 100}
                last_name: {type: string, maxLength: 100}
                email: {type: string, format: email, maxLength: 150}
                password: {type: string, minLength: 10, maxLength: 72, description: Máximo de 72 bytes}
                zone_id: {type: integer, minimum: 1}
      responses:
        '201': {description: Ciudadano y token Sanctum}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {description: Límite de registro}
  /v1/ciudadano/login:
    post:
      summary: Iniciar sesión como ciudadano
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Ciudadano y token Sanctum}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {description: Límite de login}
  /v1/ciudadano/zonas:
    get:
      summary: Enumerar las zonas activas con sus límites
      responses:
        '200': {description: Zonas activas}
  /v1/ciudadano/zonas/ubicar:
    post:
      summary: Resolver todas las zonas que contienen el punto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: {type: number, minimum: -90, maximum: 90}
                lng: {type: number, minimum: -180, maximum: 180}
      responses:
        '200': {description: Coincidencias con borde incluido}
        '422': {$ref: '#/components/responses/Validation'}
  /v1/ciudadano/perfil:
    get:
      security: [{bearer: []}]
      responses:
        '200': {description: Perfil propio}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/ciudadano/logout:
    post:
      security: [{bearer: []}]
      responses:
        '204': {description: Token revocado}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /v1/ciudadano/zona:
    post:
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone_id]
              properties:
                zone_id: {type: integer, minimum: 1}
      responses:
        '200': {description: Perfil con zona confirmada}
        '422': {$ref: '#/components/responses/Validation'}
  /v1/ciudadano/programaciones:
    get:
      security: [{bearer: []}]
      parameters:
        - {name: mes, in: query, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Calendario paginado de la zona vigente}
        '422': {$ref: '#/components/responses/Validation'}
  /v1/ciudadano/programaciones/{programacion}:
    parameters:
      - $ref: '#/components/parameters/Programacion'
    get:
      security: [{bearer: []}]
      responses:
        '200': {description: Detalle autorizado y recorrido cuando existe}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/ciudadano/programaciones/{programacion}/valoracion:
    parameters:
      - $ref: '#/components/parameters/Programacion'
    post:
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: {type: integer, minimum: 1, maximum: 5}
                comment: {type: [string, 'null'], maxLength: 500}
      responses:
        '200': {description: Promedio y conteo del recorrido}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Recorrido sin cerrar o reenvío con otro voto}
        '422': {$ref: '#/components/responses/Validation'}
  /v1/ciudadano/historial:
    get:
      security: [{bearer: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Historial autorizado y estadísticas agregadas}
  /conductor/recorridos/{recorrido}/finalizar:
    post:
      summary: Confirmar el cierre de un recorrido
      security: [{bearer: []}]
      parameters:
        - {name: recorrido, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observacion]
              properties:
                observacion: {type: string, minLength: 3, maxLength: 500}
                operacion: {type: string, format: uuid}
      responses:
        '200': {description: Cierre confirmado o respuesta original al repetir la misma operación}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {description: La operación contradice un cierre ya confirmado}
        '422': {$ref: '#/components/responses/Validation'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    Programacion:
      name: programacion
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    Unauthenticated: {description: 'Token ausente, expirado o revocado'}
    Forbidden: {description: Token sin rol ciudadano}
    NotFound: {description: Programación fuera del ámbito autorizado o inexistente}
    Validation:
      description: Error de campo
      content:
        application/json:
          example:
            message: DNI es obligatorio.
            errors:
              dni: [DNI es obligatorio.]
