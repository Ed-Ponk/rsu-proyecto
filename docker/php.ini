; Ajustes de PHP para el contenedor RSU (se suman a php.ini-production).
date.timezone = America/Lima
expose_php = Off
memory_limit = 256M
; Imágenes de vehículos: hasta 12 por formulario de 2 MB cada una.
upload_max_filesize = 4M
post_max_size = 40M
max_file_uploads = 20
; La imagen es inmutable: no hace falta revisar si los archivos cambiaron.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
