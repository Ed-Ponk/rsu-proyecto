name: Pruebas

on:
  push:
    branches: [ramirez-alternativa, main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Estilo de código
        run: vendor/bin/pint --test
      - name: Pruebas
        run: php artisan test

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pruebas
          MYSQL_DATABASE: rsu_pruebas
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppruebas"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rsu_pruebas
      DB_USERNAME: root
      DB_PASSWORD: pruebas
      SESSION_DRIVER: array
      CACHE_STORE: database
      RSU_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, fileinfo
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Integridad y procesos simultáneos MySQL
        run: php vendor/phpunit/phpunit/phpunit --configuration phpunit.mysql.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - name: Regresión HTTP con restricciones MySQL
        run: php vendor/phpunit/phpunit/phpunit --configuration phpunit.xml
