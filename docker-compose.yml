# ============================================================================
# Sistema RSU con Docker: 4 contenedores, 4 imágenes distintas.
#
#   web         nginx:1.27-alpine   Proxy inverso: recibe las visitas (puerto WEB_PORT).
#   app         imagen propia       Laravel 12 + PHP 8.3 + Apache (Dockerfile del proyecto).
#   db          mysql:8.0           Base de datos con volumen persistente.
#   phpmyadmin  phpmyadmin:5        Administración visual de la base de datos.
#
# Uso:   1) Cree su .env a partir de .env.docker.example   2) docker compose up -d
# Requiere Docker Compose 2.23.1 o superior (la configuración de nginx va dentro de este archivo).
# ============================================================================

name: rsu

services:
  db:
    image: mysql:8.0
    container_name: rsu-db
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=-05:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${DB_DATABASE:-rsu_proyecto}
      MYSQL_USER: ${DB_USERNAME:-rsu}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      TZ: ${TZ:-America/Lima}
    volumes:
      - rsu_db:/var/lib/mysql
    networks:
      - rsu_red
    healthcheck:
      # Sin contraseña: ping responde 0 aunque se niegue el acceso, así la clave de root no aparece en la lista de procesos.
      # Por TCP (127.0.0.1) y no por socket: el servidor temporal de la inicialización no escucha por red y no cuenta como listo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${RSU_IMAGE:-pieroramirezusat/rsu-municipal:latest}
    build:
      context: .
    container_name: rsu-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: RSU
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      TZ: ${TZ:-America/Lima}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-rsu_proyecto}
      DB_USERNAME: ${DB_USERNAME:-rsu}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      # Solo para que el arranque rechace el valor de ejemplo CAMBIAR_CLAVE_ROOT; la aplicación no lo usa para conectarse.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env}
      SESSION_DRIVER: database
      # false: el login funciona por http en cualquier dirección. Con HTTPS delante del proxy, poner true en el .env.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log
      MAIL_MAILER: log
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - rsu_storage:/var/www/html/storage
      - rsu_uploads:/var/www/html/public/uploads
    networks:
      - rsu_red

  web:
    image: nginx:1.27-alpine
    container_name: rsu-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    configs:
      - source: nginx_rsu
        target: /etc/nginx/conf.d/default.conf
    networks:
      - rsu_red

  phpmyadmin:
    image: phpmyadmin:5
    container_name: rsu-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      # Solo accesible desde esta computadora (127.0.0.1): no se expone a la red.
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    networks:
      - rsu_red

configs:
  nginx_rsu:
    content: |
      server {
          listen 80;
          server_name _;
          client_max_body_size 40m;

          location / {
              proxy_pass http://app:80;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_read_timeout 120s;
          }
      }

volumes:
  rsu_db:
  rsu_storage:
  rsu_uploads:

networks:
  rsu_red:
    driver: bridge
